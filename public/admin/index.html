<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex,nofollow" />
  <title>反馈后台 | Kenshi 中文互动地图</title>
  <style>
    :root { --bg: #1b1915; --panel: #24211b; --line: #3a352b; --text: #e8e0cf; --muted: #9a917f; --accent: #c8a24a; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.6 system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
    main { max-width: 860px; margin: 0 auto; padding: 20px 16px 60px; }
    h1 { font-size: 18px; color: var(--accent); margin: 0; }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    button, input { font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 5px 12px; }
    button { cursor: pointer; }
    button:hover { border-color: var(--accent); }
    button.on { border-color: var(--accent); color: var(--accent); }
    .bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 14px 0; }
    .bar .sp { flex: 1; }
    .muted { color: var(--muted); font-size: 12px; }
    #login { display: flex; gap: 8px; margin-top: 30px; }
    #login input { flex: 1; max-width: 320px; }
    .item { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 12px 14px; margin-bottom: 12px; }
    .item.done { opacity: .6; }
    .item .head { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: baseline; }
    .item .msg { white-space: pre-wrap; overflow-wrap: anywhere; margin: 8px 0; }
    .item .imgs { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0; }
    .item .imgs img { height: 120px; max-width: 100%; border: 1px solid var(--line); border-radius: 4px; display: block; }
    .item .acts { display: flex; gap: 8px; justify-content: flex-end; }
    .item .acts .del:hover { border-color: #e88a7a; color: #e88a7a; }
    .tag { border: 1px solid var(--line); border-radius: 3px; padding: 0 6px; font-size: 12px; }
    .tag.wait { color: var(--muted); }
    #error { color: #e88a7a; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
<main>
  <h1>反馈后台</h1>
  <form id="login" hidden>
    <input type="password" placeholder="后台密码" autocomplete="current-password" required />
    <button type="submit">进入</button>
  </form>
  <div id="app" hidden>
    <div class="bar">
      <button data-status="" class="on">全部</button>
      <button data-status="new">未处理</button>
      <button data-status="done">已处理</button>
      <span class="muted" id="counts"></span>
      <span class="sp"></span>
      <button id="refresh">刷新</button>
      <button id="logout">退出</button>
    </div>
    <div id="list"></div>
    <button id="more" hidden>加载更多</button>
  </div>
  <p id="error"></p>
</main>
<script>
const KEY = 'kenshi-map:admin-token';
const $ = (s) => document.querySelector(s);
const el = (tag, props = {}, ...children) => {
  const e = Object.assign(document.createElement(tag), props);
  e.append(...children);
  return e;
};
let token = localStorage.getItem(KEY) || '';
let status = '';
let cursor = 0;

async function api(path, init = {}) {
  const res = await fetch(path, { ...init, headers: { authorization: `Bearer ${token}`, 'content-type': 'application/json' } });
  if (res.status === 401) {
    logout();
    throw new Error('密码不正确');
  }
  if (!res.ok) throw new Error(`请求失败（${res.status}）`);
  return res.json();
}

function logout() {
  token = '';
  localStorage.removeItem(KEY);
  $('#app').hidden = true;
  $('#login').hidden = false;
}

const fmt = (ms) => new Date(ms).toLocaleString('zh-CN', { hour12: false });

function card(f) {
  const box = el('div', { className: `item ${f.status === 'done' ? 'done' : ''}` });
  const head = el('div', { className: 'head' }, el('strong', {}, fmt(f.created_at)));
  if (f.page) head.append(el('a', { href: f.page, target: '_blank', rel: 'noopener', textContent: decodeURI(f.page) }));
  head.append(f.issue_url
    ? el('a', { className: 'tag', href: f.issue_url, target: '_blank', rel: 'noopener', textContent: `issue #${f.issue_number}` })
    : el('span', { className: 'tag wait', textContent: '等待同步到 issue' }));
  box.append(head);
  if (f.message) box.append(el('div', { className: 'msg', textContent: f.message }));
  if (f.images.length) {
    box.append(el('div', { className: 'imgs' }, ...f.images.map((src) =>
      el('a', { href: src, target: '_blank', rel: 'noopener' }, el('img', { src, loading: 'lazy', alt: '反馈图片' })))));
  }
  if (f.contact) box.append(el('div', { className: 'muted', textContent: `联系方式：${f.contact}` }));
  if (f.ua) box.append(el('div', { className: 'muted', textContent: f.ua }));
  const toggle = el('button', { textContent: f.status === 'done' ? '重新打开' : '标为已处理' });
  toggle.onclick = () => act(async () => {
    await api(`/api/admin/feedback/${f.id}`, { method: 'PATCH', body: JSON.stringify({ status: f.status === 'done' ? 'new' : 'done' }) });
    await load(true);
  });
  const del = el('button', { className: 'del', textContent: '删除' });
  del.onclick = () => confirm('删除这条反馈及其图片？（已同步的 GitHub issue 不会被删除）') && act(async () => {
    await api(`/api/admin/feedback/${f.id}`, { method: 'DELETE' });
    await load(true);
  });
  box.append(el('div', { className: 'acts' }, toggle, del));
  return box;
}

async function load(reset) {
  if (reset) cursor = 0;
  const q = new URLSearchParams({ limit: '30' });
  if (status) q.set('status', status);
  if (cursor) q.set('before', String(cursor));
  const data = await api(`/api/admin/feedback?${q}`);
  if (reset) $('#list').replaceChildren();
  $('#list').append(...data.items.map(card));
  if (!$('#list').children.length) $('#list').append(el('p', { className: 'muted', textContent: '还没有反馈。' }));
  if (data.items.length) cursor = data.items[data.items.length - 1].created_at;
  $('#more').hidden = !data.more;
  $('#counts').textContent = `共 ${data.counts.total} 条 · 未处理 ${data.counts.open} · 待同步 ${data.counts.unsynced}`;
  $('#login').hidden = true;
  $('#app').hidden = false;
}

async function act(fn) {
  $('#error').textContent = '';
  try {
    await fn();
  } catch (e) {
    $('#error').textContent = e.message;
  }
}

$('#login').addEventListener('submit', (e) => {
  e.preventDefault();
  token = $('#login input').value.trim();
  act(async () => {
    await load(true);
    localStorage.setItem(KEY, token);
    $('#login input').value = '';
  });
});
for (const b of document.querySelectorAll('[data-status]')) {
  b.onclick = () => {
    status = b.dataset.status;
    document.querySelectorAll('[data-status]').forEach((x) => x.classList.toggle('on', x === b));
    act(() => load(true));
  };
}
$('#refresh').onclick = () => act(() => load(true));
$('#more').onclick = () => act(() => load(false));
$('#logout').onclick = logout;

if (token) act(() => load(true));
else $('#login').hidden = false;
</script>
</body>
</html>
